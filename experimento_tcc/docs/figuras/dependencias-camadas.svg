<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 590" font-family="Times New Roman, Liberation Serif, serif" font-size="16" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
  </defs>
  <rect width="1000" height="590" fill="#fff"/>

  <!-- caixas -->
  <g fill="#fff" stroke="#000" stroke-width="1.6">
    <rect x="40"  y="30"  width="200" height="70"/>   <!-- Shared -->
    <rect x="320" y="30"  width="280" height="70"/>   <!-- Scenario -->
    <rect x="40"  y="190" width="200" height="86"/>   <!-- Profile -->
    <rect x="360" y="190" width="200" height="70"/>   <!-- Flow -->
    <rect x="360" y="340" width="200" height="70"/>   <!-- Use Case -->
    <rect x="270" y="490" width="170" height="60"/>   <!-- Helper http -->
    <rect x="480" y="490" width="170" height="60"/>   <!-- Helper checks -->
  </g>
  <g fill="#e6e6e6" stroke="#000" stroke-width="1.6">
    <rect x="40" y="30" width="200" height="70"/>
  </g>

  <!-- textos das caixas -->
  <g text-anchor="middle" fill="#000">
    <text x="140" y="60" font-weight="bold">Shared</text>
    <text x="140" y="82" font-size="14">config.js (1 arquivo)</text>

    <text x="460" y="60" font-weight="bold">Scenario</text>
    <text x="460" y="82" font-size="14">ponto de entrada (15 arquivos)</text>

    <text x="140" y="220" font-weight="bold">Profile</text>
    <text x="140" y="242" font-size="14">carga e executor (10 arquivos)</text>
    <text x="140" y="262" font-size="14">9 importam o perfil comum</text>

    <text x="460" y="220" font-weight="bold">Flow</text>
    <text x="460" y="242" font-size="14">jornada (15 arquivos)</text>

    <text x="460" y="370" font-weight="bold">Use Case</text>
    <text x="460" y="392" font-size="14">ação HTTP e checks (15 arquivos)</text>

    <text x="355" y="516" font-weight="bold">Helper HTTP</text>
    <text x="355" y="536" font-size="14">transporte</text>
    <text x="565" y="516" font-weight="bold">Helper Checks</text>
    <text x="565" y="536" font-size="14">verificações</text>
  </g>

  <!-- setas: A -> B significa "A importa B" -->
  <g stroke="#000" stroke-width="1.6" fill="none" marker-end="url(#seta)">
    <line x1="320" y1="65" x2="240" y2="65"/>                 <!-- Scenario -> Shared -->
    <line x1="140" y1="190" x2="140" y2="100"/>               <!-- Profile -> Shared -->
    <line x1="350" y1="100" x2="240" y2="190"/>               <!-- Scenario -> Profile -->
    <line x1="460" y1="100" x2="460" y2="190"/>               <!-- Scenario -> Flow -->
    <line x1="460" y1="260" x2="460" y2="340"/>               <!-- Flow -> Use Case -->
    <line x1="420" y1="410" x2="370" y2="490"/>               <!-- Use Case -> HTTP -->
    <line x1="500" y1="410" x2="550" y2="490"/>               <!-- Use Case -> Checks -->
  </g>

  <!-- rótulos de contagem -->
  <g font-size="15" fill="#000" text-anchor="middle">
    <g stroke="none">
      <rect x="262" y="52" width="38" height="20" fill="#fff"/><text x="281" y="68">15</text>
      <rect x="121" y="134" width="38" height="20" fill="#fff"/><text x="140" y="150">1</text>
      <rect x="276" y="132" width="38" height="20" fill="#fff"/><text x="295" y="148">15</text>
      <rect x="470" y="132" width="38" height="20" fill="#fff"/><text x="489" y="148">15</text>
      <rect x="470" y="292" width="38" height="20" fill="#fff"/><text x="489" y="308">64</text>
      <rect x="352" y="440" width="38" height="20" fill="#fff"/><text x="371" y="456">15</text>
      <rect x="530" y="440" width="38" height="20" fill="#fff"/><text x="549" y="456">15</text>
    </g>
  </g>

  <!-- quadro da regra -->
  <g>
    <rect x="690" y="150" width="280" height="290" fill="#fff" stroke="#000" stroke-width="1.2"/>
    <text x="830" y="176" text-anchor="middle" font-weight="bold" font-size="15">Regra de dependência verificada</text>
    <g font-size="14" fill="#000">
      <text x="704" y="204">Scenario → Profile, Flow, Shared</text>
      <text x="704" y="226">Flow → Use Case</text>
      <text x="704" y="248">Use Case → Helper</text>
      <text x="704" y="270">Profile → Profile comum, Shared</text>
      <text x="704" y="292">Helper → apenas módulos do k6</text>
      <text x="704" y="326" font-weight="bold">Ocorrências ausentes (0):</text>
      <text x="704" y="348">Scenario → Use Case</text>
      <text x="704" y="370">Flow → Flow</text>
      <text x="704" y="392">Use Case → Use Case</text>
      <text x="704" y="414">importações ascendentes e ciclos</text>
    </g>
  </g>

  <text x="40" y="580" font-size="13" fill="#000">Seta A → B: o módulo da camada A importa o da camada B. Os números contam declarações import no estado analisado.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
